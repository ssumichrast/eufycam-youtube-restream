services:
  eufycam-youtube-restream:
    # Pulls the published image by default. `docker compose up --build` still
    # builds from this checkout instead, for local development.
    image: ghcr.io/ssumichrast/eufycam-youtube-restream:edge
    build: .
    container_name: eufycam-youtube-restream
    restart: unless-stopped
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
